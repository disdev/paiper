[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paiper"
version = "0.1.0"
description = "A local, color-aware e-paper daily paper."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11,<13",
    "Jinja2>=3.1,<4",
    "playwright>=1.50,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
paiper = "paiper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paiper = ["templates/*", "templates/**/*", "assets/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-work"

[tool.ruff]
target-version = "py311"
