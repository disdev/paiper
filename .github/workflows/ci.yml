name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
            requirements.txt
      - name: Install constrained application and test/build tools
        run: python -m pip install --constraint requirements.lock -e '.[dev]' 'setuptools>=75' wheel
      - name: Install Chromium and OS libraries
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q -W error

  promote:
    name: Promote tested main
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: paiper-deploy-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fast-forward deploy only while tested SHA is still main
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$live_main" != "$GITHUB_SHA" ]; then
            echo "Main moved after this run; leave deployment to the newer successful run."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/deploy"
